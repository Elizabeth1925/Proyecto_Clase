<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body><script src="common.js"></script><script>
shell('Actividad 2 · Ordena el HTML','Arrastra etiquetas a los espacios, o tócales y después toca el espacio. También hay ejercicios para escribir.');
const exercises=[
{kind:'order',title:'Estructura de una página de noticias',hint:'Organiza las etiquetas de arriba hacia abajo. <section> debe estar dentro de <main>.',tokens:['<header>','<nav>','<main>','<section>','<footer>'],answer:['<header>','<nav>','<main>','<section>','<footer>'],why:'Una página puede tener encabezado, navegación, contenido principal, una sección dentro de él y pie de página.'},
{kind:'order',title:'Estructura de una noticia',hint:'Ordena los elementos desde el contenedor principal hasta el contenido más específico.',tokens:['<main>','<section>','<article>'],answer:['<main>','<section>','<article>'],why:'<article> puede representar una noticia independiente dentro de una sección de <main>.'},
{kind:'order',title:'Formulario accesible',hint:'Organiza la secuencia de elementos de un formulario.',tokens:['<form>','<label>','<input>','<button>'],answer:['<form>','<label>','<input>','<button>'],why:'El formulario agrupa una etiqueta descriptiva, el campo de entrada y el botón de envío.'},
{kind:'type',title:'¿Qué etiqueta contiene el contenido principal?',hint:'Escribe solo el nombre de la etiqueta, sin signos < >.',answers:['main'],why:'<main> identifica el contenido principal del documento.'},
{kind:'type',title:'¿Qué etiqueta se usa para enlaces de navegación agrupados?',hint:'Escribe solo el nombre de la etiqueta.',answers:['nav'],why:'<nav> representa una sección con enlaces de navegación.'},
{kind:'type',title:'¿Qué atributo conecta <label> con el id de un campo?',hint:'Escribe el nombre del atributo de <label>.',answers:['for'],why:'El atributo for de <label> debe coincidir con el id del control.'},
{kind:'type',title:'¿Qué etiqueta contiene información del pie de página?',hint:'Escribe solo el nombre de la etiqueta.',answers:['footer'],why:'<footer> representa un pie de página de su sección o documento.'},
{kind:'order',title:'Esqueleto mínimo de documento',hint:'Organiza estas etiquetas en el orden en que comienzan dentro de un documento HTML.',tokens:['<html>','<head>','<title>','<body>'],answer:['<html>','<head>','<title>','<body>'],why:'El elemento html contiene head y body; title está dentro de head.'}
];
function render(q,ctx){let g=$('#game');g.innerHTML=`<h2>${esc(q.title)}</h2><p class="instructions muted">${esc(q.hint)}</p><div id="work"></div><div id="feedback" class="feedback hidden" role="status"></div>`;const w=$('#work'),f=$('#feedback');if(q.kind==='type'){w.innerHTML=`<label for="typed">Tu respuesta</label><p><input id="typed" type="text" autocomplete="off" placeholder="Escribe aquí"></p><button class="primary" id="check">Comprobar</button> <button id="reveal">Mostrar solución</button>`;$('#check').onclick=()=>{const ok=q.answers.some(a=>normalize(a)===normalize($('#typed').value));ctx.complete(ok);feedback(f,ok,'¡Correcto! '+q.why,'Todavía no. Revisa el concepto e inténtalo nuevamente.');};$('#reveal').onclick=()=>feedback(f,false,'',`Respuesta: ${q.answers[0]}. ${q.why}`);return}
let selected=null,placed=Array(q.answer.length).fill(null);let shuffled=shuffle(q.tokens.map((t,i)=>({t,id:i})));w.innerHTML=`<p><strong>Etiquetas disponibles:</strong></p><div class="bank" id="bank"></div><p><strong>Orden propuesto:</strong></p><div class="flow" id="slots"></div><p class="mini muted">Arrastra o selecciona una tarjeta y pulsa un espacio. Pulsa un espacio ocupado para devolver su tarjeta.</p><div class="row"><button class="primary" id="check">Comprobar orden</button><button id="clear">Limpiar</button><button id="reveal">Mostrar solución</button></div>`;
function draw(){const b=$('#bank'),s=$('#slots');b.innerHTML='';shuffled.forEach(x=>{let chip=document.createElement('button');chip.className='chip'+(selected===x.id?' selected':'')+(placed.includes(x.id)?' used':'');chip.textContent=x.t;chip.draggable=true;chip.disabled=placed.includes(x.id);chip.onclick=()=>{selected=x.id;draw()};chip.ondragstart=e=>e.dataTransfer.setData('text/plain',String(x.id));b.appendChild(chip)});s.innerHTML='';placed.forEach((id,i)=>{let slot=document.createElement('button');slot.className='slot'+(id!==null?' filled':'');slot.innerHTML=id===null?`<span class="muted">Posición ${i+1}</span>`:esc(q.tokens[id]);slot.onclick=()=>{if(id!==null){placed[i]=null}else if(selected!==null){const j=placed.indexOf(selected);if(j>=0)placed[j]=null;placed[i]=selected;selected=null}draw()};slot.ondragover=e=>e.preventDefault();slot.ondrop=e=>{e.preventDefault();const v=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(v)||v<0||v>=q.tokens.length)return;const j=placed.indexOf(v);if(j>=0)placed[j]=null;placed[i]=v;selected=null;draw()};s.appendChild(slot)})}draw();$('#check').onclick=()=>{if(placed.includes(null)){feedback(f,false,'','Completa todos los espacios antes de comprobar.');return}const ok=placed.every((id,i)=>q.tokens[id]===q.answer[i]);ctx.complete(ok);feedback(f,ok,'¡Excelente! '+q.why,'El orden todavía no es correcto. Puedes mover las tarjetas y volver a intentarlo.')};$('#clear').onclick=()=>{placed.fill(null);selected=null;draw();f.classList.add('hidden')};$('#reveal').onclick=()=>feedback(f,false,'','Solución: '+q.answer.join(' → ')+'. '+q.why)}
makeRunner(exercises,render);
</script></body></html>
