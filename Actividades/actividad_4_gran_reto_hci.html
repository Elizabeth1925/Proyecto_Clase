<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body><script src="common.js"></script><script>
shell('Actividad 4 · Gran reto HCI','Repaso final de HCI, HTML5, CSS3, diseño responsive y accesibilidad. Responde escribiendo o eligiendo una opción.');
const qs=[
{kind:'type',q:'¿Qué significan las siglas HCI?',answers:['interaccion humano computador','interaccion humano-computador','interaccion humano computadora','human computer interaction'],why:'HCI significa Interacción Humano-Computador.'},
{kind:'type',q:'Escribe la etiqueta HTML que representa el contenido principal (sin < >).',answers:['main'],why:'<main> representa el contenido principal.'},
{kind:'choice',q:'¿Qué principio HCI se aplica al mostrar “Registro completado”?',options:['Retroalimentación','Desorganización','Invisibilidad','Inconsistencia'],answer:0,why:'El mensaje informa al usuario sobre el resultado de una acción.'},
{kind:'type',q:'¿Qué lenguaje se usa para dar estilo visual a HTML?',answers:['css','css3'],why:'CSS controla la presentación visual de una página.'},
{kind:'type',q:'Completa: display: ____; activa Flexbox.',answers:['flex'],why:'display: flex crea un contenedor flexible.'},
{kind:'choice',q:'¿Cuál sistema CSS facilita una distribución en filas y columnas?',options:['CSS Grid','Solo HTML','font-size','padding'],answer:0,why:'Grid es un sistema bidimensional.'},
{kind:'type',q:'¿Qué estrategia comienza diseñando para pantallas pequeñas?',answers:['mobile first','mobile-first'],why:'Mobile First prioriza primero la experiencia móvil.'},
{kind:'choice',q:'¿Para qué sirve una media query?',options:['Para almacenar datos','Para aplicar estilos según condiciones de visualización','Para crear contraseñas','Para enviar formularios'],answer:1,why:'Una media query puede aplicar estilos según el ancho del viewport.'},
{kind:'type',q:'¿Qué atributo de HTML describe una imagen informativa para tecnologías de asistencia?',answers:['alt'],why:'El atributo alt proporciona un texto alternativo para la imagen.'},
{kind:'choice',q:'¿Qué opción mejora la accesibilidad de un formulario?',options:['Eliminar etiquetas','Usar solo colores para errores','Asociar label e input','Reducir el tamaño del texto'],answer:2,why:'Asociar label e input ayuda a identificar el propósito del campo.'},
{kind:'type',q:'¿Qué propiedad CSS establece el espacio interior de una caja?',answers:['padding'],why:'padding controla el espacio entre el contenido y el borde.'},
{kind:'choice',q:'¿Qué herramienta de Chrome permite simular distintos tamaños de pantalla?',options:['Historial','Chrome DevTools y modo de dispositivo','Descargas','Marcadores'],answer:1,why:'Las herramientas de desarrollador permiten probar tamaños de viewport.'},
{kind:'type',q:'¿Qué etiqueta HTML representa una zona de navegación?',answers:['nav'],why:'<nav> representa una sección de navegación.'},
{kind:'choice',q:'¿Qué significa que un componente sea reutilizable?',options:['Que se utiliza una sola vez','Que puede emplearse en distintas partes manteniendo consistencia','Que nunca cambia','Que solo funciona en móvil'],answer:1,why:'La reutilización favorece consistencia y mantenimiento.'},
{kind:'choice',q:'¿Cuál es un ejemplo de prevención de errores?',options:['Permitir enviar un formulario vacío sin aviso','Validar campos obligatorios antes del envío','Ocultar mensajes','Eliminar las instrucciones'],answer:1,why:'La validación ayuda a evitar acciones incorrectas.'}
];
function render(q,ctx){let g=$('#game');g.innerHTML=`<h2>Pregunta de repaso</h2><p class="question">${esc(q.q)}</p><div id="work"></div><div id="feedback" class="feedback hidden" role="status"></div>`;let w=$('#work'),f=$('#feedback');if(q.kind==='type'){w.innerHTML='<label for="typed">Escribe tu respuesta:</label><p><input id="typed" type="text" autocomplete="off" placeholder="Tu respuesta"></p><div class="row"><button class="primary" id="check">Comprobar</button><button id="reveal">Mostrar respuesta</button></div>';$('#check').onclick=()=>{let ok=q.answers.some(a=>normalize(a)===normalize($('#typed').value));ctx.complete(ok);feedback(f,ok,'¡Correcto! '+q.why,'No coincide con la respuesta esperada. Revisa el concepto o consulta al expositor.')};$('#reveal').onclick=()=>feedback(f,false,'','Respuesta esperada: '+q.answers[0]+'. '+q.why)}else{let chosen=-1;w.innerHTML='<div class="answers" id="opts"></div><div class="row" style="margin-top:14px"><button class="primary" id="check">Comprobar</button><button id="reveal">Mostrar respuesta</button></div>';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>{chosen=i;document.querySelectorAll('.option').forEach((el,j)=>el.classList.toggle('selected',j===i))};$('#opts').appendChild(b)});$('#check').onclick=()=>{if(chosen<0){feedback(f,false,'','Elige una opción.');return}let ok=chosen===q.answer;ctx.complete(ok);feedback(f,ok,'¡Correcto! '+q.why,'Incorrecto. Inténtalo de nuevo.')};$('#reveal').onclick=()=>feedback(f,false,'','Respuesta: '+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]+'. '+q.why)}}
makeRunner(qs,render);
</script></body></html>
