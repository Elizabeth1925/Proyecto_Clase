<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body><script src="common.js"></script><script>
shell('Actividad 3 · Batalla CSS','Resuelve retos de selección, escritura y ordenamiento. Participa una persona por turno.');
const qs=[
{kind:'choice',q:'¿Qué propiedad centra elementos en el eje principal de Flexbox?',code:'.menu { display: flex; flex-direction: row; /* ¿qué falta? */ }',options:['align-items: center;','justify-content: center;','text-align: left;','position: fixed;'],answer:1,why:'Con flex-direction: row, el eje principal es horizontal y justify-content: center centra los elementos.'},
{kind:'type',q:'Completa la unidad que falta para separar tarjetas.',code:'.tarjetas { display: grid; gap: 16___; }',answers:['px'],why:'16px es una longitud CSS válida para gap.'},
{kind:'choice',q:'¿Cuál declaración activa CSS Grid?',code:'.galeria { /* ¿qué declaración? */ }',options:['display: grid;','display: inline;','grid: true;','position: grid;'],answer:0,why:'display: grid activa el sistema de cuadrícula.'},
{kind:'type',q:'Escribe el nombre de la propiedad que controla el espacio interior de una caja.',code:'.tarjeta { _______: 20px; }',answers:['padding'],why:'padding separa el contenido del borde.'},
{kind:'choice',q:'¿Qué regla crea tres columnas del mismo tamaño?',code:'.productos { display: grid; /* completa */ }',options:['grid-template-columns: 3px;','grid-template-columns: repeat(3, 1fr);','flex-direction: column;','justify-content: three;'],answer:1,why:'repeat(3, 1fr) crea tres columnas de una fracción cada una.'},
{kind:'order',q:'Ordena los fragmentos para crear una regla CSS válida.',tokens:['.boton {','background-color: purple;','color: white;','}'],answer:['.boton {','background-color: purple;','color: white;','}'],why:'La regla comienza con un selector, contiene declaraciones y termina con una llave de cierre.'},
{kind:'choice',q:'¿Qué propiedad separa elementos dentro de Flexbox o Grid?',code:'.fila { display: flex; /* separación */ }',options:['font-size','gap','color','border-radius'],answer:1,why:'gap controla el espacio entre elementos del contenedor.'},
{kind:'type',q:'Completa el valor para activar Flexbox.',code:'.fila { display: ______; }',answers:['flex'],why:'display: flex activa Flexbox.'},
{kind:'choice',q:'¿Qué propiedad controla el espacio exterior alrededor de una caja?',code:'.tarjeta { /* espacio exterior */ }',options:['padding','border','margin','color'],answer:2,why:'margin crea espacio exterior al borde de un elemento.'},
{kind:'choice',q:'¿Qué opción conviene para una galería de filas y columnas?',code:'Se necesita distribuir 12 productos en una cuadrícula.',options:['CSS Grid','Solo color','font-weight','text-decoration'],answer:0,why:'Grid facilita la distribución bidimensional en filas y columnas.'}
];
function render(q,ctx){let g=$('#game');g.innerHTML=`<h2>Reto CSS</h2><p class="question">${esc(q.q)}</p>${q.code?`<div class="code">${esc(q.code)}</div>`:''}<div id="work" style="margin-top:16px"></div><div id="feedback" class="feedback hidden" role="status"></div>`;let w=$('#work'),f=$('#feedback');if(q.kind==='choice'){let selected=-1;w.innerHTML='<div class="answers" id="opts"></div><div class="row" style="margin-top:14px"><button class="primary" id="check">Comprobar</button><button id="reveal">Mostrar solución</button></div>';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>{selected=i;document.querySelectorAll('.option').forEach((el,j)=>el.classList.toggle('selected',j===i))};$('#opts').appendChild(b)});$('#check').onclick=()=>{if(selected<0){feedback(f,false,'','Selecciona una respuesta.');return}let ok=selected===q.answer;ctx.complete(ok);feedback(f,ok,'¡Correcto! '+q.why,'No es la respuesta correcta. Inténtalo otra vez.')};$('#reveal').onclick=()=>feedback(f,false,'','Respuesta: '+String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]+' '+q.why);return}
if(q.kind==='type'){w.innerHTML='<input id="typed" type="text" placeholder="Escribe tu respuesta" autocomplete="off"><div class="row" style="margin-top:14px"><button class="primary" id="check">Comprobar</button><button id="reveal">Mostrar solución</button></div>';$('#check').onclick=()=>{let ok=q.answers.some(a=>normalize(a)===normalize($('#typed').value));ctx.complete(ok);feedback(f,ok,'¡Correcto! '+q.why,'Respuesta incorrecta. Revisa la sintaxis e inténtalo de nuevo.')};$('#reveal').onclick=()=>feedback(f,false,'','Respuesta: '+q.answers[0]+'. '+q.why);return}
let selected=null,placed=Array(q.answer.length).fill(null);let tokens=shuffle(q.tokens.map((t,id)=>({t,id})));w.innerHTML='<p>Selecciona un fragmento y después una posición, o arrástralo.</p><div class="bank" id="bank"></div><p>Tu código:</p><div class="slots" id="slots"></div><div class="row" style="margin-top:14px"><button class="primary" id="check">Comprobar</button><button id="clear">Limpiar</button><button id="reveal">Mostrar solución</button></div>';function draw(){let b=$('#bank'),s=$('#slots');b.innerHTML='';tokens.forEach(x=>{let el=document.createElement('button');el.className='chip'+(selected===x.id?' selected':'');el.textContent=x.t;el.disabled=placed.includes(x.id);el.draggable=true;el.onclick=()=>{selected=x.id;draw()};el.ondragstart=e=>e.dataTransfer.setData('text/plain',String(x.id));b.appendChild(el)});s.innerHTML='';placed.forEach((id,i)=>{let el=document.createElement('button');el.className='slot'+(id!==null?' filled':'');el.textContent=id===null?'Línea '+(i+1):q.tokens[id];el.onclick=()=>{if(id!==null)placed[i]=null;else if(selected!==null){placed[i]=selected;selected=null}draw()};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let id=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(id)||id<0||id>=q.tokens.length)return;let j=placed.indexOf(id);if(j>=0)placed[j]=null;placed[i]=id;selected=null;draw()};s.appendChild(el)})}draw();$('#check').onclick=()=>{if(placed.includes(null)){feedback(f,false,'','Completa todas las líneas.');return}let ok=placed.every((id,i)=>q.tokens[id]===q.answer[i]);ctx.complete(ok);feedback(f,ok,'¡Correcto! '+q.why,'Hay un fragmento fuera de lugar. Inténtalo otra vez.')};$('#clear').onclick=()=>{placed.fill(null);selected=null;draw()};$('#reveal').onclick=()=>feedback(f,false,'','Solución: '+q.answer.join('  '))}
makeRunner(qs,render);
</script></body></html>
